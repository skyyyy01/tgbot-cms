# 项目相关配置
powerful:
    # 名称
    name: TelegramTRX
    # 版本
    version: 1.0.0
    # 版权年份
    copyrightYear: 2023
    # 实例演示开关
    demoEnabled: true
    # 文件上传路径 示例（ Windows配置D:/bot/uploadPath，Linux配置 /www/wwwroot/bot）
    profile: ${PROFILE_PATH:/www/wwwroot/bot}
    # 获取ip地址开关
    addressEnabled: false

# 数据源配置
# 注意：生产环境所有敏感配置项均通过环境变量注入，未设置时应用将启动失败（fail-fast），
#      请勿在本文件中直接填写账号密码。可参考项目根目录的 .env.example。
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trx}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
                username: ${DB_USERNAME}
                password: ${DB_PASSWORD}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url:
                username:
                password:
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter:
                enabled: true
            statViewServlet:
                # Druid 监控台会暴露全部 SQL 执行记录，生产环境默认关闭
                # 确需开启时，请设置 DRUID_STAT_ENABLED=true 并务必配置强密码与 IP 白名单
                enabled: ${DRUID_STAT_ENABLED:false}
                # 设置白名单，不填则允许所有访问
                allow: ${DRUID_ALLOW_IP:127.0.0.1}
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ${DRUID_USERNAME:admin}
                login-password: ${DRUID_PASSWORD:}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
